name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: committed dist/ is up to date
        if: runner.os == 'Linux'
        run: git diff --exit-code -- dist || (echo "::error::dist/ is stale – run npm run build and commit" && exit 1)
      - run: npm test

  integration-linux:
    name: integration (Linux Secret Service, pass, KeePassXC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: bash scripts/linux-integration.sh
        env:
          SUDO: sudo

  integration-native:
    name: integration (${{ matrix.os }} credential store)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx vitest run test/integration.test.ts
        env:
          TRESOR_INTEGRATION: '1'
