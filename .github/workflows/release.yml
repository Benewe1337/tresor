name: Release

# Runs when a version tag (v1.2.3) is pushed: tests, then a GitHub release with the
# Gemini CLI extension archive (gemini extensions install picks it up from there).
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: node scripts/build-gemini-extension.mjs
      - name: create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" build/tresor-gemini.tar.gz --title "$GITHUB_REF_NAME" --generate-notes
